[project]

name = "hierarchical-vectorless-rag"
version = "0.1.0"
description = "Domain-agnostic hierarchical vectorless RAG system"
readme = "README.md"

requires-python = ">=3.12"

dependencies = [
    "arabic-reshaper>=3.0.1",
    "faiss-cpu>=1.15.1",
    "gradio>=6.26.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.6",
    "langchain-openrouter>=0.2.9",
    "openai>=3.19.2",
    "pypdf>=6.17.0",
    "python-bidi>=0.6.11",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
]
